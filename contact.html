<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geoffrey Lallement — Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --off-white: #f7f6f3;
      --ink: #111111;
      --ink-light: #555555;
      --accent: #1a1a2e;
      --accent2: #c8a96e;
      --border: #e5e3de;
      --nav-h: 68px;
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--white); color: var(--ink); min-height: 100vh; }

    /* ── NAVBAR ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; z-index: 1000;
    }
    .nav-brand { font-family: 'DM Serif Display', serif; font-size: 1.25rem; color: var(--ink); text-decoration: none; letter-spacing: -0.02em; }
    .nav-brand span { color: var(--accent2); }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { font-size: 0.875rem; font-weight: 500; color: var(--ink-light); text-decoration: none; letter-spacing: 0.04em; text-transform: uppercase; position: relative; transition: color 0.2s; }
    .nav-links a::after { content: ''; position: absolute; bottom: -3px; left: 0; width: 0; height: 1.5px; background: var(--accent2); transition: width 0.25s ease; }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

    /* ── LAYOUT ── */
    .contact-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: calc(var(--nav-h) + 72px) 48px 120px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 80px;
      align-items: start;
    }

    /* ── LEFT : retrouvez-moi ── */
    .contact-left {}

    .section-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent2); margin-bottom: 12px; }

    .block-heading {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      letter-spacing: -0.025em;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .block-line { width: 36px; height: 2px; background: var(--accent2); margin-bottom: 40px; }

    /* Social links */
    .social-links { display: flex; flex-direction: column; gap: 18px; }

    .social-link {
      display: flex; align-items: center; gap: 20px;
      padding: 20px 24px;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-decoration: none;
      color: var(--ink);
      background: var(--white);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      animation: fadeUp 0.5s ease both;
    }
    .social-link:hover {
      border-color: var(--accent2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      transform: translateX(4px);
    }

    .social-icon {
      width: 48px; height: 48px; flex-shrink: 0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700;
    }

    .icon-pdf { background: #fff1f0; color: #e53e3e; }
    .icon-linkedin { background: #e8f0fe; color: #0a66c2; }

    .social-body {}
    .social-title { font-size: 0.95rem; font-weight: 600; color: var(--ink); }
    .social-sub { font-size: 0.82rem; color: var(--ink-light); margin-top: 2px; }

    .social-arrow { margin-left: auto; color: var(--ink-light); }

    /* ── DIVIDER vertical ── */
    .v-divider {
      width: 1px;
      background: var(--border);
      align-self: stretch;
    }

    /* ── RIGHT : me contacter ── */
    .contact-right {}

    .contact-items { display: flex; flex-direction: column; gap: 24px; margin-top: 0; }

    .contact-item {
      display: flex; align-items: center; gap: 20px;
      animation: fadeUp 0.5s ease both;
    }

    .contact-item-icon {
      width: 48px; height: 48px; flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--off-white);
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-light);
      transition: border-color 0.2s, color 0.2s;
    }

    .contact-item:hover .contact-item-icon {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    .contact-item-body {}
    .contact-item-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 4px; }
    .contact-item-value {
      font-size: 1rem; font-weight: 500; color: var(--ink);
      text-decoration: none;
      transition: color 0.2s;
    }
    a.contact-item-value:hover { color: var(--accent2); }

    /* Separating line between sections on mobile */
    .mobile-divider { display: none; height: 1px; background: var(--border); margin: 48px 0; }

    footer { border-top: 1px solid var(--border); padding: 28px 48px; display: flex; justify-content: space-between; font-size: 0.78rem; color: #bbb; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

    .social-link:nth-child(1) { animation-delay: 0.05s; }
    .social-link:nth-child(2) { animation-delay: 0.15s; }
    .contact-item:nth-child(1) { animation-delay: 0.1s; }
    .contact-item:nth-child(2) { animation-delay: 0.2s; }

    @media (max-width: 800px) {
      nav { padding: 0 24px; }
      .contact-wrap { grid-template-columns: 1fr; gap: 0; padding-left: 24px; padding-right: 24px; }
      .v-divider { display: none; }
      .mobile-divider { display: block; }
      footer { padding: 24px; flex-direction: column; gap: 6px; }
    }
  </style>
</head>
