<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geoffrey Lallement — Projets</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --off-white: #f9f6f1;
      --ink: #1c1c2e;
      --ink-light: #5d5d70;
      --accent: #1a1a2e;
      --accent2: #c8a96e;
      --teal: #5fa194;
      --blue: #5b7fa6;
      --coral: #d98f72;
      --violet: #9285b8;
      --red: #e96363;
      --border: #e6e1d8;
      --nav-h: 68px;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--off-white);
      color: var(--ink);
      min-height: 100vh;
      position: relative;
    }

    /* ── BACKGROUND TEXTURE ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(28,28,46,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(28,28,46,0.03) 1px, transparent 1px);
      background-size: 64px 64px;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(150px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 620px; height: 620px; background: var(--accent2); opacity: 0.16; top: -200px; right: -160px; }
    .orb-2 { width: 520px; height: 520px; background: var(--teal); opacity: 0.13; bottom: -120px; left: -180px; }
    .orb-3 { width: 380px; height: 380px; background: var(--coral); opacity: 0.10; top: 50%; left: 55%; transform: translate(-50%,-50%); }

    nav, .page-header, .projects-grid, footer {
      position: relative;
      z-index: 1;
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(249,246,241,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; z-index: 1000;
    }
    .nav-brand { font-family: 'DM Serif Display', serif; font-size: 1.25rem; color: var(--ink); text-decoration: none; letter-spacing: -0.02em; }
    .nav-brand span { color: var(--accent2); }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { font-size: 0.875rem; font-weight: 500; color: var(--ink-light); text-decoration: none; letter-spacing: 0.04em; text-transform: uppercase; position: relative; transition: color 0.2s; }
    .nav-links a::after { content: ''; position: absolute; bottom: -3px; left: 0; width: 0; height: 1.5px; background: var(--accent2); transition: width 0.25s ease; }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

    /* ── PAGE HEADER ── */
    .page-header {
      padding-top: calc(var(--nav-h) + 72px);
      padding-bottom: 56px;
      padding-left: 48px;
      padding-right: 48px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .section-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent2); margin-bottom: 12px; }
    .page-heading { font-family: 'DM Serif Display', serif; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: -0.025em; color: var(--ink); }
    .page-sub { margin-top: 14px; font-size: 0.95rem; color: var(--ink-light); line-height: 1.7; max-width: 520px; }

    /* ── GRID ── */
    .projects-grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 48px 120px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 28px;
    }

    /* ── CARD ── */
    .project-card {
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      background: var(--white);
      transition: box-shadow 0.25s, transform 0.25s, border-color 0.25s;
      animation: fadeUp 0.5s ease both;
      position: relative;
    }
    .project-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent2);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .project-card:hover::before { opacity: 1; }
    .project-card:hover {
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      transform: translateY(-4px);
      border-color: var(--accent2);
    }

    /* Cycling accent colors per project */
    .project-card:nth-child(1) { --card-accent: var(--teal); }
    .project-card:nth-child(2) { --card-accent: var(--coral); }
    .project-card:nth-child(3) { --card-accent: var(--blue); }
    .project-card:nth-child(4) { --card-accent: var(--violet); }
    .project-card:nth-child(5) { --card-accent: var(--accent2); }
    .project-card:nth-child(6) { --card-accent: var(--red); }
    .project-card:nth-child(7) { --card-accent: var(--coral); }

    .project-card::before { background: var(--card-accent, var(--accent2)); }
    .project-card:hover { border-color: var(--card-accent, var(--accent2)); }
    .project-card .card-tag, .project-card .card-num { color: var(--card-accent, var(--accent2)); }
    .project-card .card-cta { border-bottom-color: var(--card-accent, var(--accent2)); }

    .card-img {
      width: 100%;
      height: 200px;
      background: var(--off-white);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-img-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .card-img-placeholder svg { opacity: 0.25; }
    .card-img-placeholder span { font-size: 0.75rem; color: #bbb; }

    .card-num {
      position: absolute;
      top: 12px; left: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent2);
      background: rgba(255,255,255,0.9);
      padding: 3px 8px;
      border-radius: 2px;
    }

    .card-body { padding: 20px 22px 24px; }
    .card-tag { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2); margin-bottom: 8px; }
    .card-title { font-family: 'DM Serif Display', serif; font-size: 1.2rem; color: var(--ink); margin-bottom: 10px; line-height: 1.25; }
    .card-desc { font-size: 0.85rem; line-height: 1.65; color: var(--ink-light); }
    .card-cta {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 18px;
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--ink); border-bottom: 1px solid var(--accent2); padding-bottom: 1px;
    }
    .card-cta svg { transition: transform 0.2s; }
    .project-card:hover .card-cta svg { transform: translateX(4px); }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 4px;
      max-width: 680px;
      width: calc(100% - 48px);
      max-height: 88vh;
      overflow-y: auto;
      transform: translateY(20px) scale(0.98);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
    }
    .modal::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--teal), var(--accent2), var(--coral));
      z-index: 1;
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-header {
      padding: 28px 32px 0;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
    }
    .modal-num { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2); }
    .modal-close {
      background: none; border: none; cursor: pointer;
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      color: var(--ink-light); border-radius: 50%;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .modal-close:hover { background: var(--off-white); color: var(--ink); }

.modal-img {
  margin: 20px 32px 0;
  background: var(--off-white);
  border-radius: 2px;
  border: 1px solid var(--border);

  display: flex;
  justify-content: center;
  align-items: center;

  max-height: 70vh;
  overflow: hidden;
}

.modal-img img {
  max-width: 100%;
  max-height: 70vh;

  width: auto;
  height: auto;

  object-fit: contain;
}
    .modal-img-placeholder { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .modal-img-placeholder svg { opacity: 0.2; }
    .modal-img-placeholder span { font-size: 0.78rem; color: #ccc; }

    .modal-body { padding: 24px 32px 36px; }
    .modal-tag { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2); margin-bottom: 10px; }
    .modal-title { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 20px; line-height: 1.2; }
    .modal-desc {
      font-size: 0.92rem; line-height: 1.8; color: var(--ink-light);
      border-left: 2px solid var(--accent2); padding-left: 18px;
    }
    .modal-desc-placeholder { font-style: italic; color: #ccc; }
    .modal-desc p {
  white-space: pre-line;
}
.modal-desc strong {
  display: block;
  margin-top: 18px;
  margin-bottom: 6px;
  color: var(--ink);
  font-size: 1rem;
  letter-spacing: 0.02em;
}

    /* ── FOOTER ── */
    footer { border-top: 1px solid var(--border); padding: 28px 48px; display: flex; justify-content: space-between; font-size: 0.78rem; color: #bbb; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

    .project-card:nth-child(1) { animation-delay: 0.05s; }
    .project-card:nth-child(2) { animation-delay: 0.10s; }
    .project-card:nth-child(3) { animation-delay: 0.15s; }
    .project-card:nth-child(4) { animation-delay: 0.20s; }
    .project-card:nth-child(5) { animation-delay: 0.25s; }
    .project-card:nth-child(6) { animation-delay: 0.30s; }
    .project-card:nth-child(7) { animation-delay: 0.35s; }

    @media (max-width: 800px) {
      nav { padding: 0 24px; }
      .page-header, .projects-grid { padding-left: 24px; padding-right: 24px; }
      footer { padding: 24px; }
    }
  </style>
</head>

  <script>
    // ──────────────────────────────────────────────────────────────
    // ✏️  MODIFIEZ CE TABLEAU POUR PERSONNALISER VOS PROJETS
    // ──────────────────────────────────────────────────────────────
    const projects = [
  {
    id: 1,
    tag: "Modélisation",
    title: "Création d’un reporting",
    shortDesc:
      "Création d’un outil de reporting automatisé sous Excel et VBA permettant le suivi et la visualisation des résultats académiques",
    fullDesc: `
<strong>Contexte :</strong> Dans le cadre de notre premier projet universitaire réalisé sur une semaine complète, nous devions concevoir un reporting automatisé à l’aide d’Excel et du langage VBA.L’objectif était de créer un outil permettant aux étudiants de visualiser et de suivre plus facilement leurs résultats académiques. Ce projet a été réalisé en binôme.

<strong>Objectif :</strong> Développer un outil personnel de gestion et de suivi des notes à l’aide d’Excel et VBA, intégrant l’automatisation de certaines tâches de calcul et de mise à jour des données.

<strong>Bilan :</strong> Réalisé avec Julien, nous avons pu répartir les tâches tout en s’entraidant sur les points difficiles. La principale difficulté a été l’intégration entre les fonctionnalités VBA et l’environnement Excel afin d’assurer un fonctionnement fluide et automatisé. Cette expérience nous a permis de développer nos compétences en programmation VBA, en logique d’automatisation ainsi qu’en travail d’équipe.
    `,
    image: "images/SAEVBA.png"
  },

  {
    id: 2,
    tag: "Analyse de données",
    title: "Construction et présentation d’indicateurs de performances",
    shortDesc:
      "Analyse des performances financières de Fleury-Michon et création d’un tableau de bord synthétique",
    fullDesc: `
<strong>Contexte :</strong> Pour mener à bien ce projet, nous avons mené une analyse financière du groupe Fleury-Michon à partir de plusieurs documents comptables et financiers.Le projet avait pour but d’évaluer la situation et les performances de l’entreprise en utilisant différents outils d’analyse financière, tels que les ratios et les KPI. Nous devions ensuite exploiter ces résultats afin de construire un tableau de bord clair et visuel mettant en évidence les principaux indicateurs de l’entreprise.

<strong>Objectif :</strong> Réaliser une étude des performances financières et économiques d'une entreprise en construisant et en analysant des indicateurs de performance (KPI)'

<strong>Bilan :</strong>  Bien que le temps accordé pour ce projet était court (3 heures), nous avons pu réaliser un travail qui répondait aux attendus avec Adrien T. L’un des principaux défis a été d’interpréter des indicateurs parfois contradictoires et d’en tirer une lecture cohérente et argumentée. Ce travail m’a permis de renforcer mes compétences en synthèse, en visualisation de données et en interprétation financière mais aussi comprendre ce qui se cache derrière un indicateur, identifier les signaux faibles et replacer chaque résultat dans son contexte sectoriel
    `,
    image: "images/SAEKPIECO.png"
  },

  {
    id: 3,
    tag: "Visualisation",
    title: "Visualisation de données",
    shortDesc:
      "Analyse descriptive des données Parcoursup et création d’un ensemble de visualisations thématiques avec GGplot",
    fullDesc: `
<strong>Contexte :</strong> Ce projet avait pour but d’explorer les données Parcoursup 2024–2025 et les effectifs de spécialités en terminale afin de produire une série de visualisations thématiques avec GGplot. Nous devions sélectionner un angle d’analyse, préparer les données, puis concevoir sept graphiques variés (univariés, bivariés, géographiques, etc.), chacun accompagné d’une interprétation chiffrée. Le travail portait autant sur la qualité visuelle des représentations que sur la pertinence des choix de variables.

<strong>Objectif :</strong> Produire un ensemble cohérent de visualisations descriptives à partir des données Parcoursup et des effectifs de spécialités, en utilisant GGplot et en interprétant chaque graphique.

<strong>Bilan :</strong> Réalisé en binôme avec Adrien T., ce projet nous a demandé une forte coordination afin de sélectionner un thème pertinent et d'exploiter efficacement les trois jeux de données fournis. La principale difficulté a été de modéliser des graphiques à la fois pertinents et respectant les conditions demandées (sept graphiques variés : univariés qualitatifs et quantitatifs, bivariés, géographiques, etc.). Cette expérience nous a permis de renforcer nos compétences en manipulation de données sous R, en visualisation statistique et en interprétation d’indicateurs. 
    `,
    image: "images/SAEReportingDataR.png"
  },

  {
    id: 4,
    tag: "Statistique inférentielle",
    title: "Echantillonnage et Estimation",
    shortDesc:
      "Estimation de la population régionale à partir d’échantillonnages simples et stratifiés sous R",
    fullDesc: `
<strong>Contexte :</strong> Dans ce projet, nous avons étudié l’estimation d’un paramètre de population à partir de méthodes d’échantillonnage appliquées aux communes d’une région française. Le travail consistait à manipuler des données réelles, à tirer des échantillons aléatoires simples puis stratifiés, et à analyser la précision des estimations obtenues à l’aide d’intervalles de confiance. L’ensemble du processus a été réalisé sous R, en commentant chaque étape et en interprétant les résultats obtenus.

<strong>Objectif :</strong> Estimer la population totale d’une région à l’aide de méthodes d’échantillonnage (échantillonage aléatoire simple et stratifié) et analyser la précision des estimations via les intervalles de confiance.

<strong>Bilan :</strong>  Réalisé avec Adrien T., ce projet nous a confrontés à des méthodes d’échantillonnage plus complexes que celles abordées en cours, notamment le sondage aléatoire simple et le sondage stratifié. Une première difficulté a consisté à préparer et nettoyer les données afin de garantir leur cohérence avant les analyses. Nous avons ensuite dû comprendre et appliquer correctement les formules d’estimation, de variance et d’intervalles de confiance, tout en répétant les simulations pour analyser la stabilité des résultats. Ce travail nous a permis de consolider nos compétences en statistique inférentielle, en programmation R commentée, ainsi qu’en interprétation critique des méthodes d’échantillonnage, tout en prenant conscience de l’importance de la qualité des données et du choix du plan de sondage.
    `,
    image: "images/SAEEchantillon.png"
  },

  {
    id: 5,
    tag: "Modélisation prédictive",
    title: "Régression sur des données réelles",
    shortDesc:
      "Modélisation des prix immobiliers niortais et prédiction des valeurs foncières via régression linéaire.",
    fullDesc: `
<strong>Contexte :</strong> Dans ce projet, nous avons travaillé sur des données réelles de transactions immobilières de l’agglomération niortaise afin de modéliser les prix de vente. Après une phase d’exploration et de segmentation, nous avons construit des modèles de régression linéaire simple adaptés à différents groupes de logements, en testant plusieurs transformations pour améliorer l’ajustement. Le travail s’est conclu par la prédiction des prix manquants dans un fichier dédié.

<strong>Objectif :</strong> Modéliser les prix immobiliers à l’aide de régressions linéaires simples et prédire les valeurs manquantes dans un jeu de données réel.

<strong>Bilan :</strong> En binôme avec Adrien J., la principale difficulté a été de trouver les meilleures segmentations de Niort afin d'avoir le meilleur coefficient de détermination possible. Nous avons donc dû tester différentes transformations et évaluer la qualité des prédictions à partir du fichier test et du R2 (coefficient de détermination). Ce projet nous a permis de développer des compétences solides en modélisation statistique, en manipulation de données réelles, en implémentation mathématique en R, ainsi qu’en analyse critique des performances d’un modèle prédictif.
    `,
    image: "images/SAERegression.png"
  },

  {
    id: 6,
    tag: "Ingénierie des données",
    title: "Conception et implémentation d’une base de données",
    shortDesc:
      "Conception et implémentation d’une base de données logistique avec automatisation Python et interface Tkinter.",
    fullDesc: `
<strong>Contexte :</strong> Dans ce projet, nous avons travaillé pour une entreprise fictive spécialisée dans la livraison bas‑carbone souhaitant moderniser et centraliser la gestion de ses flux logistiques. Les données existantes, réparties dans plusieurs fichiers CSV et très peu structurées, devaient être nettoyées, modélisées puis intégrées dans une base relationnelle complète. Le travail a consisté à concevoir un modèle conceptuel et relationnel, générer et alimenter une base MySQL, automatiser l’import de données via Python et développer une interface graphique Tkinter permettant de manipuler et d’exploiter la base de données.

<strong>Objectif :</strong> Concevoir, implémenter et exploiter une base de données relationnelle complète pour centraliser des flux logistiques incluant modélisation, intégration des données, automatisation Python et création d’une interface de gestion.

<strong>Bilan :</strong> En équipe avec Adrien T. et Marouane, nous avons travaillé, lors de ce projet, sur Looping, EasyPHP et Tkinter, des logiciels que nous n'avions encore jamais utilisés. Ce projet a surtout été formateur en matière d'adaptation rapide à de nouvelles connaissances, mais aussi dans la répartition du travail. Une partie difficile du projet consistait à relier les fichiers CSV entre eux en prenant en compte le modèle conceptuel, préalablement modélisé par nos soins via Looping. Cette difficulté rencontrée sur Python a donc été pour moi l'occasion d'améliorer mes compétences dans ce langage tout en découvrant l'environnement EasyPHP. Le projet s'est conclu par une vidéo bilan présentant notre travail ainsi qu'une soutenance.

    const grid = document.getElementById('projectsGrid');
    projects.forEach(p => {
      const imgHTML = p.image
        ? `<img src="${p.image}" alt="${p.title}" />`
        : `<div class="card-img-placeholder">
             <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.2">
               <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
               <polyline points="21 15 16 10 5 21"/>
             </svg>
             <span>Image du projet</span>
           </div>`;

      const card = document.createElement('article');
      card.className = 'project-card';
      card.setAttribute('data-id', p.id);
      card.innerHTML = `
        <div class="card-img">
          <span class="card-num">0${p.id}</span>
          ${imgHTML}
        </div>
        <div class="card-body">
          <p class="card-tag">${p.tag}</p>
          <h2 class="card-title">${p.title}</h2>
          <p class="card-desc">${p.shortDesc}</p>
          <span class="card-cta">Voir le projet
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </span>
        </div>`;
      card.addEventListener('click', () => openModal(p));
      grid.appendChild(card);
    });

    // ── Modal logic ──
    const overlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');

    function openModal(p) {
      document.getElementById('modalNum').textContent = `Projet 0${p.id}`;
      document.getElementById('modalTag').textContent = p.tag;
      document.getElementById('modalTitle').textContent = p.title;
      document.getElementById('modalDesc').innerHTML = p.fullDesc
        ? `<p>${p.fullDesc}</p>`
        : `<p class="modal-desc-placeholder">Description complète à remplir…</p>`;
        

      const imgBox = document.getElementById('modalImg');
      if (p.image) {
        imgBox.innerHTML = `<img src="${p.image}" alt="${p.title}" />`;
      } else {
        imgBox.innerHTML = `<div class="modal-img-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.2">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span>Ajoutez une image au projet</span>
        </div>`;
      }

      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
